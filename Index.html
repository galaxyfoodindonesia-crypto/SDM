<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Database SDM - GFI</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --panel2:#1f2937; --line:#334155;
      --text:#e5e7eb; --muted:#94a3b8; --brand:#22c55e; --brand2:#16a34a;
      --danger:#ef4444; --warn:#f59e0b; --blue:#3b82f6;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{background:linear-gradient(135deg,#065f46,#064e3b);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
    header h1{font-size:18px;margin:0}
    header .sub{font-size:12px;color:#a7f3d0}
    .badge{font-size:11px;padding:3px 8px;border-radius:20px;background:#052e16;color:#86efac;display:inline-flex;align-items:center;gap:6px}
    .dot{width:8px;height:8px;border-radius:50%;background:#64748b}
    .dot.live{background:var(--brand);box-shadow:0 0 8px var(--brand)}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;align-items:center}
    input,select,button,textarea{font:inherit}
    .input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;outline:none}
    .input:focus{border-color:var(--brand)}
    .btn{border:none;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;color:#fff;background:var(--panel2)}
    .btn.primary{background:var(--brand2)}
    .btn.primary:hover{background:var(--brand)}
    .btn.blue{background:var(--blue)}
    .btn.warn{background:var(--warn);color:#111}
    .btn.danger{background:var(--danger)}
    .btn.ghost{background:transparent;border:1px solid var(--line)}
    .btn:hover{filter:brightness(1.08)}
    .grow{flex:1;min-width:180px}
    .wrap{padding:0 20px 40px}
    .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
    table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
    th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
    th{background:var(--panel2);position:sticky;top:0;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:#cbd5e1}
    tr:hover td{background:#0b1220}
    .actions{display:flex;gap:6px}
    .icon-btn{border:none;border-radius:6px;padding:5px 9px;cursor:pointer;color:#fff;font-size:12px}
    .muted{color:var(--muted)}
    .count{font-size:12px;color:var(--muted);padding:8px 2px}
    /* Modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto}
    .overlay.show{display:flex}
    .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .modal h2{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px}
    .modal .body{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field.full{grid-column:1/-1}
    .field label{font-size:12px;color:var(--muted)}
    .modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
    .toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--brand);padding:12px 16px;border-radius:8px;z-index:100;max-width:360px;display:none}
    .toast.err{border-left-color:var(--danger)}
    .toast.show{display:block}
    .spinner{width:16px;height:16px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:640px){.modal .body{grid-template-columns:1fr}}
    .loading{padding:40px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📋 Database SDM — GFI</h1>
      <div class="sub">Terhubung ke Google Spreadsheet &amp; Firebase Realtime Database</div>
    </div>
    <div>
      <span class="badge"><span id="liveDot" class="dot"></span><span id="liveText">menghubungkan…</span></span>
    </div>
  </header>

  <div class="toolbar">
    <input id="search" class="input grow" placeholder="🔎 Cari nama, NIK, jabatan, dll…" oninput="renderTable()">
    <button class="btn primary" onclick="openCreate()">➕ Tambah Karyawan</button>
    <button class="btn blue" onclick="openAddColumn()">🧩 Kolom Baru</button>
    <button class="btn ghost" onclick="loadAll(true)">🔄 Muat Ulang</button>
    <button class="btn ghost" onclick="syncAll()">☁️ Sync ke Firebase</button>
  </div>

  <div class="wrap">
    <div class="count" id="count"></div>
    <div class="tablewrap">
      <table id="table">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"><tr><td class="loading">Memuat data…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Tambah/Edit -->
  <div class="overlay" id="modal">
    <div class="modal">
      <h2 id="modalTitle">Tambah Karyawan</h2>
      <div class="body" id="modalBody"></div>
      <div class="foot">
        <button class="btn ghost" onclick="closeModal()">Batal</button>
        <button class="btn primary" id="saveBtn" onclick="saveRecord()">💾 Simpan</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var COLUMNS = [];      // daftar header termasuk 'ID'
    var ROWS = [];         // data karyawan
    var EDIT_ID = null;    // id yang sedang diedit (null = create)
    var CONFIG = null;

    // ---------- helper google.script.run -> Promise ----------
    function api(fn, args){
      return new Promise(function(resolve,reject){
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function(e){ reject(e); })
          [fn].apply(google.script.run, args||[]);
      });
    }

    function toast(msg, isErr){
      var t=document.getElementById('toast');
      t.textContent=msg; t.className='toast show'+(isErr?' err':'');
      setTimeout(function(){ t.className='toast'; }, 3500);
    }

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

    // ---------- load ----------
    function loadAll(showToast){
      document.getElementById('tbody').innerHTML='<tr><td class="loading">Memuat data…</td></tr>';
      return api('getConfig_').then(function(cfg){
        CONFIG=cfg; COLUMNS=cfg.columns||[];
        return api('listEmployees_');
      }).then(function(rows){
        ROWS=rows||[]; renderHead(); renderTable();
        if(showToast) toast('Data dimuat: '+ROWS.length+' karyawan');
        initRealtime();
      }).catch(function(e){
        document.getElementById('tbody').innerHTML='<tr><td class="loading">Gagal memuat: '+esc(e.message||e)+'</td></tr>';
        toast('Gagal memuat data: '+(e.message||e), true);
      });
    }

    function renderHead(){
      var tr=document.getElementById('thead');
      var html=COLUMNS.map(function(c){return '<th>'+esc(c)+'</th>';}).join('');
      html+='<th>Aksi</th>';
      tr.innerHTML=html;
    }

    function renderTable(){
      var q=(document.getElementById('search').value||'').toLowerCase();
      var tb=document.getElementById('tbody');
      var filtered=ROWS.filter(function(r){
        if(!q) return true;
        return COLUMNS.some(function(c){ return String(r[c]==null?'':r[c]).toLowerCase().indexOf(q)>=0; });
      });
      if(filtered.length===0){ tb.innerHTML='<tr><td class="loading">Tidak ada data.</td></tr>'; }
      else{
        tb.innerHTML=filtered.map(function(r){
          var cells=COLUMNS.map(function(c){ return '<td>'+esc(r[c])+'</td>'; }).join('');
          var id=esc(r['ID']);
          cells+='<td class="actions">'+
            '<button class="icon-btn blue" onclick="openEdit(\''+id+'\')" style="background:#3b82f6">✏️</button>'+
            '<button class="icon-btn danger" onclick="removeRow(\''+id+'\')" style="background:#ef4444">🗑️</button></td>';
          return '<tr>'+cells+'</tr>';
        }).join('');
      }
      document.getElementById('count').textContent='Menampilkan '+filtered.length+' dari '+ROWS.length+' karyawan';
    }

    // ---------- modal create/edit ----------
    function buildForm(record){
      var body=document.getElementById('modalBody');
      body.innerHTML=COLUMNS.filter(function(c){return c!=='ID';}).map(function(c){
        var val=esc(record?record[c]:'');
        var full=(c.length>18)?' full':'';
        var lower=c.toLowerCase();
        var isArea=lower.indexOf('alamat')>=0||lower.indexOf('keterangan')>=0;
        var inp=isArea
          ? '<textarea class="input" rows="2" data-col="'+esc(c)+'">'+val+'</textarea>'
          : '<input class="input" data-col="'+esc(c)+'" value="'+val+'">';
        return '<div class="field'+full+'"><label>'+esc(c)+'</label>'+inp+'</div>';
      }).join('');
    }

    function openCreate(){
      EDIT_ID=null;
      document.getElementById('modalTitle').textContent='Tambah Karyawan';
      buildForm(null);
      document.getElementById('modal').classList.add('show');
    }
    function openEdit(id){
      var rec=ROWS.filter(function(r){return String(r['ID'])===String(id);})[0];
      if(!rec){ toast('Data tidak ditemukan',true); return; }
      EDIT_ID=id;
      document.getElementById('modalTitle').textContent='Edit Karyawan — '+id;
      buildForm(rec);
      document.getElementById('modal').classList.add('show');
    }
    function closeModal(){ document.getElementById('modal').classList.remove('show'); }

    function collectForm(){
      var rec={};
      document.querySelectorAll('#modalBody [data-col]').forEach(function(el){
        rec[el.getAttribute('data-col')]=el.value;
      });
      return rec;
    }

    function saveRecord(){
      var rec=collectForm();
      var btn=document.getElementById('saveBtn');
      btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Menyimpan…';
      var p= EDIT_ID
        ? api('updateEmployee_',[EDIT_ID,rec])
        : api('createEmployee_',[rec]);
      p.then(function(){
        toast(EDIT_ID?'Data diperbarui':'Karyawan ditambahkan');
        closeModal(); return loadAll(false);
      }).catch(function(e){ toast('Gagal menyimpan: '+(e.message||e),true); })
      .then(function(){ btn.disabled=false; btn.innerHTML='💾 Simpan'; });
    }

    function removeRow(id){
      if(!confirm('Hapus data karyawan ini?\nID: '+id)) return;
      api('deleteEmployee_',[id]).then(function(){
        toast('Data dihapus'); return loadAll(false);
      }).catch(function(e){ toast('Gagal menghapus: '+(e.message||e),true); });
    }

    // ---------- kolom baru ----------
    function openAddColumn(){
      var name=prompt('Nama kolom baru:');
      if(!name) return;
      api('addColumn_',[name.trim()]).then(function(cols){
        COLUMNS=cols; toast('Kolom "'+name+'" ditambahkan');
        renderHead(); renderTable();
      }).catch(function(e){ toast('Gagal menambah kolom: '+(e.message||e),true); });
    }

    // ---------- sync ----------
    function syncAll(){
      toast('Menyinkronkan ke Firebase…');
      api('syncAllToFirebase_').then(function(r){
        toast('Sync selesai: '+ (r&&r.count!=null?r.count:'?') +' data');
      }).catch(function(e){ toast('Gagal sync: '+(e.message||e),true); });
    }

    // ---------- realtime (opsional via Firebase JS SDK) ----------
    function setLive(on,text){
      document.getElementById('liveDot').className='dot'+(on?' live':'');
      document.getElementById('liveText').textContent=text||(on?'realtime aktif':'offline');
    }
    var fbInited=false;
    function initRealtime(){
      if(fbInited) return;
      var fc=CONFIG && CONFIG.firebaseConfig;
      if(!fc || !fc.databaseURL){ setLive(false,'realtime nonaktif'); return; }
      fbInited=true;
      loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js')
       .then(function(){return loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js');})
       .then(function(){
          try{
            firebase.initializeApp(fc);
            var db=firebase.database();
            var first=true;
            db.ref('meta/lastUpdate').on('value',function(snap){
              setLive(true,'realtime aktif');
              if(first){ first=false; return; }
              // ada perubahan dari klien lain -> muat ulang senyap
              api('listEmployees_').then(function(rows){ ROWS=rows||[]; renderTable(); });
            }, function(){ setLive(false,'realtime (akses ditolak)'); });
          }catch(e){ setLive(false,'realtime error'); }
       }).catch(function(){ setLive(false,'realtime gagal dimuat'); });
    }
    function loadScript(src){
      return new Promise(function(res,rej){
        var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
    }

    // close modal on overlay click
    document.getElementById('modal').addEventListener('click',function(e){
      if(e.target.id==='modal') closeModal();
    });

    loadAll(false);
  </script>
</body>
</html>
